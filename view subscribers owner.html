<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX GYM | Subscribers</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <a href="index.html" class="nav-brand">APEX<span>GYM</span> <span style="font-size: 0.95rem; font-weight: 500; color: var(--text-muted); margin-left: 0.5rem; background: var(--primary-light); padding: 0.2rem 0.6rem; border-radius: 4px; vertical-align: middle; border: 1px solid rgba(225, 29, 72, 0.15);">Owner Portal</span></a>
    <ul class="nav-links">
      <li><a href="view booking owner.html">Bookings Calendar</a></li>
      <li><a href="view orders owner.html">Customer Orders</a></li>
      <li><a href="view settings owner.html">Custom Messages</a></li>
      <li><a href="view performance owner.html">Analytics &amp; Performance</a></li>
      <li><a href="view subscribers owner.html" class="active">Subscribers</a></li>
      <li><a href="product.html" style="color: var(--accent);">Front Store</a></li>
    </ul>
    <div class="nav-actions">
      <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle Theme"></button>
    </div>
  </header>

  <main>
    <section class="boxed-panel">
      <div id="owner-access-form">
        <label for="owner-code">Owner Code:</label>
        <div class="owner-access-group">
          <input type="password" id="owner-code" placeholder="Enter owner code" autocomplete="off">
          <button id="load-owner-subscribers-btn" class="verify-btn" type="button">Load Subscribers</button>
        </div>
      </div>

      <div id="owner-subscribers-container" style="display:none;">
        <h3>Subscribers</h3>
        <div id="subscribers-list">Loading…</div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 APEX GYM. All rights reserved.</p>
  </footer>

  <script>
    const ownerAccessCode = 'LiaMycIaa123';

    async function loadSubscribers() {
      const container = document.getElementById('subscribers-list');
      try {
        const res = await fetch('http://localhost:3000/subscribers');
        if (!res.ok) throw new Error('Failed to fetch');
        const subs = await res.json();
        if (!subs || !subs.length) {
          container.innerHTML = '<p class="no-bookings">No subscribers found.</p>';
          return;
        }
        const table = document.createElement('table');
        table.className = 'simple-table';
        table.innerHTML = `
          <thead><tr><th>Name</th><th>Email</th><th>Subscribed</th></tr></thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector('tbody');
        subs.forEach(s => {
          const row = document.createElement('tr');
          const d = new Date(s.createdAt || Date.now());
          row.innerHTML = `<td>${s.name || ''}</td><td>${s.email}</td><td>${d.toLocaleString()}</td>`;
          tbody.appendChild(row);
        });
        container.innerHTML = '';
        container.appendChild(table);
      } catch (e) {
        container.innerHTML = `<p class="no-bookings">Error loading subscribers: ${e.message}</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const ownerCodeInput = document.getElementById('owner-code');
      const loadBtn = document.getElementById('load-owner-subscribers-btn');
      const container = document.getElementById('owner-subscribers-container');

      if (sessionStorage.getItem('ownerAuthorized') === 'true') {
        container.style.display = 'block';
        loadSubscribers();
      }

      loadBtn.addEventListener('click', () => {
        const entered = ownerCodeInput.value.trim();
        if (entered !== ownerAccessCode) {
          alert('Invalid owner code.');
          return;
        }
        sessionStorage.setItem('ownerAuthorized', 'true');
        container.style.display = 'block';
        loadSubscribers();
      });

      ownerCodeInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadBtn.click();
      });
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
