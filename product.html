<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Gymnastics Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-buttons">
      <button id="back-button" type="button">Back to Home</button>
    </div>
    <button id="cart-button" type="button">Cart <span class="cart-badge">0</span></button>
    <h1>Our Products</h1>
    <p>Browse our selection of gymnastics gear and apparel.</p>
  </header>

  <main>
    <section id="products">
      <h2>Products</h2>
      <div class="products-grid">
        <article class="product-card">
          <div class="product-image">No image available</div>
          <div class="product-info">
            <h3>Balance Beam Trainer</h3>
            <p class="product-price">$79.99</p>
            <p>Portable foam balance beam for home practice.</p>
            <button class="product-buy" type="button">Buy</button>
          </div>
        </article>

        <article class="product-card">
          <div class="product-image">No image available</div>
          <div class="product-info">
            <h3>Gymnastics Grips</h3>
            <p class="product-price">$24.99</p>
            <p>Comfortable leather grips for bar work.</p>
            <button class="product-buy" type="button">Buy</button>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Gymnastics Store</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const backButton = document.getElementById('back-button');
      const cartButton = document.getElementById('cart-button');
      const cartBadge = document.querySelector('.cart-badge');

      if (backButton) {
        backButton.addEventListener('click', () => {
          window.location.href = 'index.html';
        });
      }

      // removed header buy button; cart and product buy buttons handle navigation

      // initialize cart count from localStorage
      function getCartCount() {
        return parseInt(localStorage.getItem('cartCount') || '0', 10);
      }

      function setCartCount(n) {
        localStorage.setItem('cartCount', String(n));
        if (cartBadge) cartBadge.textContent = String(n);
      }

      setCartCount(getCartCount());

      if (cartButton) {
        cartButton.addEventListener('click', () => {
          window.location.href = 'buy.html';
        });
      }

      // product "Buy" buttons: add to cart and update badge
      const productBuyButtons = document.querySelectorAll('.product-buy');
      productBuyButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const current = getCartCount();
          setCartCount(current + 1);
        });
      });
    });
  </script>
</body>
</html>
