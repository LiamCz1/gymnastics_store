<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX GYM | Subscribers</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>
  <div id="header-root"></div>

  <main>
    <section class="boxed-panel">
      <div id="owner-access-form">
        <label for="owner-code">Owner Code:</label>
        <div class="owner-access-group">
          <input type="password" id="owner-code" placeholder="Enter owner code" autocomplete="off">
          <button id="load-owner-subscribers-btn" class="verify-btn" type="button">Load Subscribers</button>
        </div>
      </div>

      <div id="owner-subscribers-container" style="display:none;">
        <h3>Subscribers</h3>
        <div id="subscribers-list">Loading…</div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="src/templates.js"></script>
  <script>renderOwnerHeader();</script>

  <script>
    const ownerAccessCode = 'LiaMycIaa123';

    async function loadSubscribers() {
      const container = document.getElementById('subscribers-list');
      container.innerHTML = 'Loading…';
      // Try API endpoint first, then fall back to a local JSON file if present.
      const candidates = [
        'http://localhost:3000/subscribers',
        './server/subscribers.json',
        'server/subscribers.json'
      ];

      for (const url of candidates) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) throw new Error('Failed to fetch ' + url);
          const subs = await res.json();
          if (!subs || !subs.length) {
            container.innerHTML = '<p class="no-bookings">No subscribers found.</p>';
            return;
          }
          const table = document.createElement('table');
          table.className = 'simple-table';
          table.innerHTML = `
            <thead><tr><th>Name</th><th>Email</th><th>Subscribed</th></tr></thead>
            <tbody></tbody>
          `;
          const tbody = table.querySelector('tbody');
          subs.forEach(s => {
            const row = document.createElement('tr');
            const d = new Date(s.createdAt || Date.now());
            row.innerHTML = `<td>${s.name || ''}</td><td>${s.email}</td><td>${d.toLocaleString()}</td>`;
            tbody.appendChild(row);
          });
          container.innerHTML = '';
          container.appendChild(table);
          try { localStorage.setItem('localSubscribers', JSON.stringify(subs)); } catch (e) {}
          return;
        } catch (e) {
          // try next candidate
        }
      }

      container.innerHTML = `<p class="no-bookings">Error loading subscribers: unable to reach API or local file.</p>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const ownerCodeInput = document.getElementById('owner-code');
      const loadBtn = document.getElementById('load-owner-subscribers-btn');
      const container = document.getElementById('owner-subscribers-container');

      if (sessionStorage.getItem('ownerAuthorized') === 'true') {
        container.style.display = 'block';
        loadSubscribers();
      }

      loadBtn.addEventListener('click', () => {
        const entered = ownerCodeInput.value.trim();
        if (entered !== ownerAccessCode) {
          alert('Invalid owner code.');
          return;
        }
        sessionStorage.setItem('ownerAuthorized', 'true');
        container.style.display = 'block';
        loadSubscribers();
      });

      ownerCodeInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadBtn.click();
      });
    });
  </script>
  <script src="src/script.js"></script>
</body>
</html>
