<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX GYM | Owner Settings Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>
  <div id="header-root"></div>

  <main>
    <section class="boxed-panel">
      <div id="owner-access-form">
        <label for="owner-code">Owner Code:</label>
        <div class="owner-access-group">
          <input type="password" id="owner-code" placeholder="Enter owner code" autocomplete="off">
          <button id="load-owner-settings-btn" class="verify-btn" type="button">Access Settings</button>
        </div>
      </div>
      <div id="owner-settings-container" style="display: none;">
        <!-- Settings UI copied from original -->
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="src/templates.js"></script>
  <script>renderOwnerHeader();</script>

  <script src="src/script.js"></script>
</body>
</html>
