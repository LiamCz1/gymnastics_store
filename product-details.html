<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX GYM | Product Details</title>
  <meta name="description" content="View product details and add gymnastics gear to your cart.">
  <meta name="theme-color" content="#111827">
  <link rel="canonical" href="https://liamcz1.github.io/gymnastics_store/product-details.html">
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Graduate&family=Pacifico&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <a href="#main-content" style="position:absolute;left:-9999px;top:auto;">Skip to main content</a>
  <div id="header-root"></div>

  <main id="main-content" class="page-shell" style="padding: 2rem 1.25rem 4rem;">
    <div class="product-detail-layout" style="max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 1fr; gap: 2rem; align-items: start;">
      <div id="product-detail-image-wrap" style="background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 1.25rem; box-shadow: var(--shadow-sm);">
        <img id="product-detail-image" src="" alt="" style="width: 100%; max-height: 480px; object-fit: contain; display: block; border-radius: var(--radius-lg);">
      </div>

      <article id="product-detail-card" style="background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 2rem; box-shadow: var(--shadow-sm);">
        <div id="product-detail-badge" class="badge" style="display:inline-block; margin-bottom:1rem;">Product</div>
        <h1 id="product-detail-name" style="margin:0 0 0.75rem; font-size: clamp(2rem, 3vw, 3rem);">Loading product...</h1>
        <p id="product-detail-price" style="font-size: 2rem; font-weight: 800; color: var(--accent); margin: 0 0 1rem;">$0.00</p>
        <p id="product-detail-description" style="margin: 0 0 1.5rem; color: var(--text-muted); line-height: 1.7; font-size: 1.05rem;">Loading details...</p>

        <ul id="product-detail-features" style="list-style:none; padding:0; margin:0 0 1.5rem; display:grid; gap:0.75rem; color: var(--text-dark);">
        </ul>

        <div style="display:flex; flex-wrap:wrap; gap:0.75rem; margin-bottom: 1.5rem;">
          <button id="add-to-cart-btn" class="btn" type="button" style="padding: 0.9rem 1.4rem; font-size: 1rem;">Add to Cart</button>
          <button id="continue-shopping-btn" class="btn btn-secondary" type="button" style="padding: 0.9rem 1.4rem; font-size: 1rem;">Continue Shopping</button>
        </div>

        <div style="padding-top:1rem; border-top:1px solid var(--border-color); color: var(--text-muted); display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;">
          <span>Stock: <strong id="product-detail-stock">0</strong></span>
          <span>Category: <strong id="product-detail-category">General</strong></span>
        </div>
      </article>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="src/templates.js"></script>
  <script src="src/product-data.js"></script>
  <script>
    function getProductIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    function normalizeCart(cart) {
      if (!Array.isArray(cart)) return [];
      return cart
        .map(item => {
          if (!item || !item.id) return null;
          return {
            id: String(item.id),
            quantity: Math.max(1, Number(item.quantity) || 1)
          };
        })
        .filter(Boolean);
    }

    function getCart() {
      try {
        const cart = JSON.parse(localStorage.getItem('gymCart') || '[]');
        const normalized = normalizeCart(cart);
        if (normalized.length !== cart.length) {
          localStorage.setItem('gymCart', JSON.stringify(normalized));
        }
        return normalized;
      } catch (e) {
        return [];
      }
    }

    function updateCartBadge(cart) {
      const badge = document.getElementById('nav-cart-badge') || document.querySelector('.cart-badge');
      const normalized = Array.isArray(cart) ? cart : getCart();
      const count = normalized.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
      if (badge) {
        badge.textContent = String(count);
        badge.style.display = count > 0 ? 'inline-block' : 'none';
      }
      localStorage.setItem('cartCount', String(count));
    }

    function renderProductDetails() {
      const productId = getProductIdFromUrl();
      const products = window.productCatalog || [];
      const product = products.find(item => item.id === productId) || products[0];

      if (!product) {
        document.getElementById('product-detail-name').textContent = 'Product not found';
        document.getElementById('product-detail-price').textContent = '$0.00';
        document.getElementById('product-detail-description').textContent = 'Please return to the shop and choose a valid product.';
        return;
      }

      document.getElementById('product-detail-badge').textContent = product.badge || 'Featured';
      document.getElementById('product-detail-name').textContent = product.name;
      document.getElementById('product-detail-price').textContent = `$${Number(product.price).toFixed(2)}`;
      document.getElementById('product-detail-description').textContent = product.description;
      document.getElementById('product-detail-image').src = product.image;
      document.getElementById('product-detail-image').alt = product.name;
      document.getElementById('product-detail-stock').textContent = product.stock;
      document.getElementById('product-detail-category').textContent = product.category || 'General';

      const featuresList = document.getElementById('product-detail-features');
      featuresList.innerHTML = '';
      (product.features || []).forEach(feature => {
        const item = document.createElement('li');
        item.innerHTML = '<span aria-hidden="true">✓</span> ' + feature;
        item.style.display = 'flex';
        item.style.gap = '0.5rem';
        item.style.alignItems = 'center';
        featuresList.appendChild(item);
      });

      const addToCartBtn = document.getElementById('add-to-cart-btn');
      addToCartBtn.addEventListener('click', () => {
        const cart = getCart();
        const existing = cart.find(item => item.id === product.id);

        if (existing) {
          existing.quantity += 1;
        } else {
          cart.push({ id: product.id, quantity: 1 });
        }

        localStorage.setItem('gymCart', JSON.stringify(cart));
        updateCartBadge(cart);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const continueShoppingBtn = document.getElementById('continue-shopping-btn');
      if (continueShoppingBtn) {
        continueShoppingBtn.addEventListener('click', () => {
          window.location.href = 'product.html';
        });
      }

      renderProductDetails();
      updateCartBadge(getCart());
    });
  </script>
</body>

</html>
