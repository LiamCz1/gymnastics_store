<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Bookings - Gymnastics Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="boxed-header">
    <div class="header-buttons">
      <button id="back-button" type="button">Back to Lessons</button>
    </div>
    <h1>Owner Booking Calendar</h1>
    <p>View and manage all lesson bookings.</p>
  </header>

  <main>
    <section class="boxed-panel">
      <div id="owner-access-form">
        <label for="owner-code">Owner Code:</label>
        <div class="owner-access-group">
          <input type="password" id="owner-code" placeholder="Enter owner code" autocomplete="off">
          <button id="load-owner-bookings-btn" class="verify-btn" type="button">Load Bookings</button>
        </div>
      </div>
      <div id="owner-calendar" class="owner-calendar" style="display: none;">
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Gymnastics Store</p>
  </footer>

  <script>
    const ownerAccessCode = 'LiaMycIaa123';

    function getBookedSlots() {
      try {
        return JSON.parse(localStorage.getItem('bookedLessonSlots') || '[]');
      } catch (e) {
        return [];
      }
    }

    function setBookedSlots(slots) {
      localStorage.setItem('bookedLessonSlots', JSON.stringify(slots));
    }

    function displayOwnerBookings() {
      const bookedSlots = getBookedSlots();
      const ownerCalendar = document.getElementById('owner-calendar');
      const ownerAccessForm = document.getElementById('owner-access-form');

      ownerAccessForm.style.display = 'none';
      ownerCalendar.innerHTML = '';

      if (bookedSlots.length === 0) {
        ownerCalendar.innerHTML = '<p class="no-bookings">No bookings available.</p>';
        ownerCalendar.style.display = 'block';
        return;
      }

      const bookingsByDate = {};
      bookedSlots.forEach((booking, index) => {
        const dateKey = booking.date;
        if (!bookingsByDate[dateKey]) {
          bookingsByDate[dateKey] = [];
        }
        bookingsByDate[dateKey].push({ ...booking, index });
      });

      const sortedDates = Object.keys(bookingsByDate).sort();
      sortedDates.forEach(dateKey => {
        const dateHeader = document.createElement('div');
        dateHeader.className = 'owner-calendar-date';
        const dateObj = new Date(dateKey + 'T00:00:00');
        dateHeader.textContent = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        ownerCalendar.appendChild(dateHeader);

        const dateList = document.createElement('div');
        dateList.className = 'owner-date-slot-list';

        bookingsByDate[dateKey].sort((a, b) => a.time.localeCompare(b.time)).forEach(booking => {
          const bookingItem = document.createElement('div');
          bookingItem.className = 'owner-booking-item';
          bookingItem.innerHTML = `
            <div class="owner-booking-info">
              <strong>${booking.lesson}</strong>
              <p>${booking.time} &middot; ${booking.type === 'weekly' ? 'Weekly' : 'One-Time'}</p>
              <p>Booked by: ${booking.bookerName}</p>
            </div>
            <button class="owner-cancel-booking-btn" data-index="${booking.index}">Cancel</button>
          `;
          dateList.appendChild(bookingItem);
        });

        ownerCalendar.appendChild(dateList);
      });

      ownerCalendar.style.display = 'block';

      ownerCalendar.querySelectorAll('.owner-cancel-booking-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const index = parseInt(e.target.dataset.index, 10);
          const slots = getBookedSlots();
          const booking = slots[index];
          if (!booking) {
            alert('Booking not found.');
            return;
          }
          if (confirm(`Cancel booking for ${booking.lesson} on ${booking.date} at ${booking.time}?`)) {
            slots.splice(index, 1);
            setBookedSlots(slots);
            displayOwnerBookings();
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const ownerCodeInput = document.getElementById('owner-code');
      const loadOwnerBookingsBtn = document.getElementById('load-owner-bookings-btn');
      const backButton = document.getElementById('back-button');

      if (backButton) {
        backButton.addEventListener('click', () => {
          window.location.href = 'lessons.html';
        });
      }

      loadOwnerBookingsBtn.addEventListener('click', () => {
        const enteredCode = ownerCodeInput.value.trim();
        if (enteredCode !== ownerAccessCode) {
          alert('Invalid owner code.');
          return;
        }
        displayOwnerBookings();
      });

      ownerCodeInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          loadOwnerBookingsBtn.click();
        }
      });
    });
  </script>
</body>
</html>
